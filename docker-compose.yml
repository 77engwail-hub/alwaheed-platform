version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alwaheed_postgres
    restart: always
    environment:
      POSTGRES_USER: alwaheed_user
      POSTGRES_PASSWORD: StrongPassword2026!
      POSTGRES_DB: alwaheed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alwaheed_user -d alwaheed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alwaheed_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: alwaheed_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://alwaheed_user:StrongPassword2026!@postgres:5432/alwaheed_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-key-replace-in-production-al-waheed-2026
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_PATH: /app/uploads
      API_URL: http://localhost:4000/api/v1
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  storefront:
    build:
      context: .
      dockerfile: infrastructure/docker/storefront.Dockerfile
    container_name: alwaheed_storefront
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
    container_name: alwaheed_admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
