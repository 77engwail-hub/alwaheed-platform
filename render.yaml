# Render Blueprint for Al-Waheed Platform
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. Backend API Service
  - type: web
    name: alwaheed-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install && pnpm --filter @al-waheed/types build && pnpm --filter @al-waheed/validation build && pnpm --filter @al-waheed/api build && pnpm --filter @al-waheed/api db:push && pnpm --filter @al-waheed/api db:seed
    startCommand: pnpm --filter @al-waheed/api start
    disk:
      name: alwaheed-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: INITIAL_ADMIN_PASSWORD
        value: Admin@AlWaheed2026!
